[package]
name = "rusting_engine"
version = "1.3.0"
authors = ["Vasyl Trefilov <drenfor228@gmail.com>"]
edition = "2021"
description = "Vulkan 3D game engine with GPU-accelerated physics for massive physics-heavy scenes"
license-file = "LICENSE.md"
repository = "https://github.com/GoingRusting/RustingEngine"
readme = "README.md"
keywords = [
    "vulkan",
    "gpu-physics",
    "game-engine",
    "3d",
    "gamedev",
]
categories = ["rendering", "game-engines"]
exclude = ["testModels/*", "AGENTS.md", "plan.md", "benchmark/"]
homepage = "https://github.com/GoingRusting/RustingEngine"
documentation = "https://docs.rs/rusting_engine"

[workspace]
members = ["testGame", "crates/rusting-core"]
default-members = ["."]
resolver = "2"

[[bin]]
name = "user_main"
path = "src/user_main.rs"

[[bin]]
name = "editor"
path = "src/bin/editor.rs"
required-features = ["editor"]

[[bin]]
name = "game"
path = "src/bin/game.rs"
required-features = ["window"]

[[bin]]
name = "cook_scene"
path = "src/bin/cook_scene.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["editor", "gltf"]
window = ["dep:vulkano-util"]
editor = [
    "window",
    "gltf",
    "dep:egui",
    "dep:egui-winit",
    "dep:rfd",
    "dep:vulkano-util",
]
gltf = ["dep:gltf"]
validation = []
experimental-gpu-physics = []
gpu-tests = []

[dependencies]
rusting-core = { version = "0.1.0", path = "crates/rusting-core" }
bytemuck = "1.25.0"
nalgebra = "0.34.2"
rand = "0.10.0"
vulkano = "0.35.2"
vulkano-shaders = "0.35.0"
winit = { version = "0.30.12", features = ["serde"] }
rayon = "1.10"
gltf = { version = "1.4.1", optional = true, features = ["KHR_lights_punctual"] }
smallvec = "1.15.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
bevy_ecs = { version = "0.19.1", features = ["multi_threaded"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bincode = "1.3.3"
uuid = { version = "1.25.0", features = ["serde", "v4"] }
egui = { version = "0.31.1", optional = true }
egui-winit = { version = "0.31.1", default-features = false, features = ["clipboard", "wayland", "x11"], optional = true }
rfd = { version = "0.17.2", optional = true }
vulkano-util = { version = "0.35.0", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[[example]]
name = "gltf_test"
path = "src/examples/gltf_test.rs"
required-features = ["gltf"]

[[example]]
name = "native_texture"
path = "src/examples/native_texture.rs"

[[example]]
name = "hybrid_10k"
path = "src/examples/hybrid_10k.rs"
required-features = ["window"]

[[example]]
name = "physics_bench"
path = "src/examples/physics_bench.rs"
required-features = ["window"]
